version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
    # Ignore Terraform provider updates — only check module git refs
    ignore:
      - dependency-name: "hashicorp/*"
      - dependency-name: "azurerm"
      - dependency-name: "azure/*"
      - dependency-name: "*"
